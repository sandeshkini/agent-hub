name: agent-hub

# Consolidated agent-hub stack: Open WebUI + both adapters + Ollama.
# Reboot-safe via restart:unless-stopped (+ docker.service enabled).
# Secrets come from .env (gitignored). OWUI reaches adapters by SERVICE NAME
# on the compose network; owui-hermes reaches host Hermes via host-gateway.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      WEBUI_NAME: "Aibo Agents"
      WEBUI_AUTH: "false"
      # adapters are reachable by service name on the compose network
      OPENAI_API_BASE_URLS: "http://owui-hermes:9211/v1;http://owui-claude:9212/v1;http://owui-opencode:9213/v1"
      OPENAI_API_KEYS: "${ADAPTER_KEY};${ADAPTER_KEY};${ADAPTER_KEY}"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"   # forwards X-OpenWebUI-Chat-Id -> session continuity
      ENABLE_OLLAMA_API: "true"                  # Phase 3: local model fallback
      OLLAMA_BASE_URL: "http://ollama:11434"     # reach the ollama container by service name
      # agents/personas primitives (personas = Workspace Models; grouped by Folders;
      # orchestrated via Channels + Automations + background Subagents)
      ENABLE_CHANNELS: "true"
      ENABLE_FOLDERS: "true"
      ENABLE_SUBAGENTS: "true"
      SUBAGENTS_BACKGROUND_ENABLED: "true"
      ENABLE_AUTOMATIONS: "true"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      WHISPER_MODEL: "base"                       # local STT for voice
      RESET_CONFIG_ON_START: "true"              # re-seed connections from env each boot
      # shared web search (model-agnostic) via Tavily — scraping happens on Tavily's
      # servers, so our home IP is never used (unlike SearXNG). Claude uses its own native search.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "tavily"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      WEB_SEARCH_RESULT_COUNT: "5"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"   # inject Tavily's clean results directly (skip slow CPU rerank)
      BYPASS_WEB_SEARCH_WEB_LOADER: "true"                # use Tavily's returned content; don't re-fetch each page (was ~82s)
      # OWUI only runs its forced web-search RAG when a model's function-calling is "legacy".
      # Our adapters are plain chat endpoints (no OWUI-native tools), so default every model to
      # legacy → the web-search toggle actually fires. (Harmless for the adapters' internal tools.)
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
    depends_on:
      - owui-hermes
      - owui-claude
      - owui-opencode
    networks:
      - default          # reach the adapters by service name
      - apps             # reach the artifacts board (http://artifacts:8080) + publish/notify

  owui-hermes:
    build: ./owui-hermes
    image: agent-hub/owui-hermes
    container_name: owui-hermes
    restart: unless-stopped
    expose:
      - "9211"
    extra_hosts:
      - "host.docker.internal:host-gateway"      # reach host Hermes :9119
    environment:
      HERMES_BASE: "http://host.docker.internal:9119"
      HERMES_DASH_USER: "${HERMES_DASH_USER}"
      HERMES_DASH_PW: "${HERMES_DASH_PW}"
      ADAPTER_KEY: "${ADAPTER_KEY}"
      PORT: "9211"

  owui-claude:
    build: ./owui-claude
    image: agent-hub/owui-claude
    container_name: owui-claude
    restart: unless-stopped
    expose:
      - "9212"
    user: "1000:1000"                 # = host user beastblaster; files created keep correct ownership
    # (no working_dir override — node runs server.mjs from /app; the AGENT's cwd is WORKSPACE below)
    volumes:
      - /home/beastblaster:/home/beastblaster   # full host home access (agents work on real files)
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"   # subscription OAuth (NOT ANTHROPIC_API_KEY)
      ADAPTER_KEY: "${ADAPTER_KEY}"
      OWUI_CLAUDE_PORT: "9212"
      CLAUDE_MODELS: "${CLAUDE_MODELS}"
      CLAUDE_MODEL: "${CLAUDE_MODEL}"
      WORKSPACE: "/home/beastblaster"
      HOME: "/home/node"              # container-isolated CLI config (uid 1000 owns /home/node)

  opencode:
    build: ./opencode
    image: agent-hub/opencode
    container_name: opencode
    restart: unless-stopped
    expose:
      - "4096"
    user: "1000:1000"                 # = host user; file ops keep correct ownership
    working_dir: /home/beastblaster
    volumes:
      - /home/beastblaster:/home/beastblaster   # full host home access
    environment:
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"   # opencode Zen provider (seeded into auth.json)
      HOME: "/home/node"              # container-isolated opencode config/auth (uid 1000 owns /home/node)

  owui-opencode:
    build: ./owui-opencode
    image: agent-hub/owui-opencode
    container_name: owui-opencode
    restart: unless-stopped
    expose:
      - "9213"
    environment:
      OPENCODE_BASE: "http://opencode:4096"
      ADAPTER_KEY: "${ADAPTER_KEY}"
      PORT: "9213"
      OPENCODE_MODELS: "${OPENCODE_MODELS}"
    depends_on:
      - opencode

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"                  # host-local only; reserved for Phase-3 local LLM
    volumes:
      - ollama:/root/.ollama

volumes:
  open-webui:
    external: true          # reuse existing volume (preserves chat history)
  ollama:
    external: true          # reuse existing volume
  owui-claude-workspace: {} # new, compose-managed
  opencode-workspace: {}    # new, compose-managed

networks:
  default:                  # the agent-hub stack's own network (adapters ↔ OWUI)
  apps:
    external: true          # shared 'apps' network → OWUI can reach the artifacts board (publish/notify)
