name: agent-hub

# ─────────────────────────────────────────────────────────────────────────────
# Agent Hub — ONE compose for the whole stack, with two roles via profiles:
#   COMPOSE_PROFILES=hub   → full hub: Open WebUI (fork) + adapters + ollama + mcp-tools + registrar
#   COMPOSE_PROFILES=node  → a worker box: adapters + registrar only (registers into a remote hub)
# Set COMPOSE_PROFILES in .env, then just: `docker compose up -d`
#
# owui-terminal is NOT here — it needs a REAL host shell (heroku/git/claude), so it runs on the host
# (see owui-terminal/install.sh). The hub reaches it at host.docker.internal:7681.
# Secrets + machine-specific paths come from .env (see .env.example). Reboot-safe (restart:unless-stopped).
# ─────────────────────────────────────────────────────────────────────────────

services:
  open-webui:
    image: ${OWUI_IMAGE:-agent-hub/open-webui:v0.11.0-fork}   # fork by default; docker-compose.stock.yml rolls back to :main
    container_name: open-webui
    profiles: ["hub"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"      # reach the host owui-terminal PTY service (:7681)
    ports:
      - "${OWUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment: &owui-env         # anchored so open-webui-staging reuses the EXACT same env (no drift)
      WEBUI_NAME: "Aibo Agents"
      WEBUI_AUTH: "false"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"     # PINNED → stable JWT sessions across restarts
      NODE_HUB_TOKEN: "${NODE_HUB_TOKEN:-}"       # gates /api/nodes/register (empty = open, LAN only)
      # Settings→Account→API keys; the slack-gateway needs one for OWUI_API_KEY. NOTE: this only seeds
      # a FRESH `open-webui` volume — the value is persisted in the DB (`auth.enable_api_keys`), so on
      # an existing volume flip it in Admin Settings → General instead.
      ENABLE_API_KEYS: "${ENABLE_API_KEYS:-true}"
      # local adapters (hermes/claude/opencode) + optional remote-node connections appended via MB_* (E10.7)
      # owui-claude runs on the HOST (systemd --user owui-claude.service) for FULL system access
      # (systemctl, all drives, host processes) — parity with local Claude Code. Reached via host-gateway.
      OPENAI_API_BASE_URLS: "http://owui-hermes:9211/v1;http://host.docker.internal:9212/v1;http://host.docker.internal:9213/v1${MB_OPENAI_URLS:-}"
      OPENAI_API_KEYS: "${ADAPTER_KEY};${ADAPTER_KEY};${ADAPTER_KEY}${MB_OPENAI_KEYS:-}"
      OPENAI_API_CONFIGS: "${MB_OPENAI_CONFIGS:-{}}"   # per-connection cfg (prefix_id for remote nodes → mb.*)
      # RESILIENCE (E10.7): remote nodes (MacBook) are laptops that sleep. Bound the per-connection
      # model-list fetch so an OFFLINE node fails fast (5s) instead of hanging the whole model load and
      # 500-ing the hub page. Local adapters answer in <100ms; only a dead remote hits this cap.
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "5"
      ADAPTER_KEY: "${ADAPTER_KEY}"                # E7: /api/agent/answer proxies to owui-claude with this
      CLAUDE_ADAPTER_URL: "http://host.docker.internal:9212"   # host-run claude adapter (full system access)
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"   # forwards X-OpenWebUI-Chat-Id -> session continuity
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      # Inbox summaries: FREE model via the OpenCode Zen gateway (plain completion, no agent, no local CPU).
      # SUMMARY_PROVIDER=ollama to revert to the local model.
      SUMMARY_PROVIDER: "${SUMMARY_PROVIDER:-openai}"
      SUMMARY_ADAPTER_URL: "${SUMMARY_ADAPTER_URL:-https://opencode.ai/zen/v1}"
      SUMMARY_MODEL: "${SUMMARY_MODEL:-deepseek-v4-flash-free}"
      SUMMARY_API_KEY: "${OPENCODE_API_KEY}"
      ENABLE_CHANNELS: "true"
      ENABLE_FOLDERS: "true"
      ENABLE_SUBAGENTS: "true"
      SUBAGENTS_BACKGROUND_ENABLED: "true"
      ENABLE_AUTOMATIONS: "true"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      WHISPER_MODEL: "base"                       # STT: local faster-whisper — dictation works offline ✓
      # TTS (read-aloud): default '' = browser speechSynthesis (works on desktop; flaky in the iOS PWA).
      # For reliable iOS read-aloud set AUDIO_TTS_ENGINE=openai + AUDIO_TTS_OPENAI_API_BASE_URL / _API_KEY /
      # AUDIO_TTS_MODEL(tts-1) / AUDIO_TTS_VOICE in .env. NOTE: the local 'transformers' engine is currently
      # broken upstream (datasets lib dropped the speecht5 speaker-embeddings script). Must be set here,
      # not the admin UI (RESET_CONFIG_ON_START wipes API-set config).
      AUDIO_TTS_ENGINE: "${AUDIO_TTS_ENGINE:-}"
      AUDIO_TTS_OPENAI_API_BASE_URL: "${AUDIO_TTS_OPENAI_API_BASE_URL:-}"
      AUDIO_TTS_OPENAI_API_KEY: "${AUDIO_TTS_OPENAI_API_KEY:-}"
      AUDIO_TTS_MODEL: "${AUDIO_TTS_MODEL:-tts-1}"
      AUDIO_TTS_VOICE: "${AUDIO_TTS_VOICE:-alloy}"
      RESET_CONFIG_ON_START: "true"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "tavily"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      WEB_SEARCH_RESULT_COUNT: "5"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
      BYPASS_WEB_SEARCH_WEB_LOADER: "true"
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
      # NATIVE terminal feature: register the host owui-terminal PTY service as an OWUI terminal server.
      # id MUST equal this box's TERMINAL_ID or the machine selector can't match the terminal to the machine.
      # Default = this box's host shell. Multi-machine: override with TERMINAL_SERVERS_JSON in .env (aibo + remote nodes).
      TERMINAL_SERVER_CONNECTIONS: "${TERMINAL_SERVERS_JSON:-[{\"id\":\"${TERMINAL_ID:-aibo}\",\"name\":\"${TERMINAL_NAME:-aibo (host shell)}\",\"url\":\"http://host.docker.internal:7681\",\"auth_type\":\"bearer\",\"key\":\"${TERMINAL_TOKEN}\",\"enabled\":true,\"access_control\":null}]}"
    depends_on:
      - owui-hermes
    networks:
      - default
      - apps

  # STAGING / render-gate canary — a 2nd OWUI on :3001 with its OWN volume (never touches prod chats).
  # owui-fork/deploy.sh render-tests a new build HERE before promoting to prod; also reachable at
  # staging.operator.kingdomofluna.com to eyeball UI changes. `extends` mirrors prod's full env (zero
  # duplication). OFF by default (profile "staging") — deploy.sh brings it up on demand.
  open-webui-staging:
    image: ${OWUI_IMAGE:-agent-hub/open-webui:v0.11.0-fork}
    container_name: open-webui-staging
    profiles: ["staging"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OWUI_STAGING_PORT:-3001}:8080"
    volumes:
      - open-webui-staging:/app/backend/data
    environment: *owui-env         # same env as prod (aliased) — faithful render test
    networks:
      - default
      - apps

  owui-hermes:
    build: ./owui-hermes
    image: agent-hub/owui-hermes
    container_name: owui-hermes
    profiles: ["hub"]                              # the single Hermes brain lives on the hub only
    restart: unless-stopped
    ports:
      - "${ADAPTER_BIND:-127.0.0.1}:9211:9211"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HERMES_BASE: "http://host.docker.internal:9119"
      HERMES_DASH_USER: "${HERMES_DASH_USER}"
      HERMES_DASH_PW: "${HERMES_DASH_PW}"
      ADAPTER_KEY: "${ADAPTER_KEY}"
      PORT: "9211"
      IDLE_TIMEOUT: "300"
      FF_STATE_DIR: "/ffstate"
    volumes:
      - ./ff-state:/ffstate

  owui-claude:
    build: ./owui-claude
    image: agent-hub/owui-claude
    container_name: owui-claude
    # HUB (aibo) runs claude on the HOST instead (systemd --user owui-claude.service) for full system
    # access — so the container is NODE-only now (the MacBook still uses it until it migrates too).
    profiles: ["node"]
    restart: unless-stopped
    # Share the host PID namespace so the agent can actually SEE the host for a real health check
    # (host processes, not just its own 5). Pairs with the docker socket below; set AGENT_PID_HOST= blank
    # in .env to opt out. (systemctl still needs host execution — a container can't drive host systemd.)
    pid: "${AGENT_PID_HOST:-host}"
    ports:
      - "${ADAPTER_BIND:-127.0.0.1}:9212:9212"
    user: "${DOCKER_USER:-1000:1000}"
    # SYSTEM ACCESS: the hub agent should operate the box like the human's local Claude Code. It gets
    # the whole $HOME mounted rw (files) AND the docker socket (drive the docker/compose stack). group_add
    # = the HOST's docker group gid (aibo=984; set DOCKER_GID per machine) so the non-root user can use
    # the socket. NOTE: docker.sock is root-equivalent on the host — the bash guardrail (canUseTool +
    # PreToolUse) still blocks destructive shell, but docker itself is powerful; this is deliberate
    # ("full host access, guardrail retained"). It does NOT grant host systemctl (that needs host exec).
    group_add:
      - "${DOCKER_GID:-984}"
    volumes:
      - ${WORKSPACE_HOST:-${HOME}}:${WORKSPACE:-${HOME}}
      - ./ff-state:/ffstate
      - /var/run/docker.sock:/var/run/docker.sock     # operate the docker/compose stack
      # Share the human's config so the hub agent behaves exactly like their local Claude Code —
      # same global instructions, same settings, writable both ways.
      - ${WORKSPACE_HOST:-${HOME}}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md
      - ${WORKSPACE_HOST:-${HOME}}/.claude/settings.json:/home/node/.claude/settings.json
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      ADAPTER_KEY: "${ADAPTER_KEY}"
      FF_STATE_DIR: "/ffstate"
      OWUI_CLAUDE_PORT: "9212"
      CLAUDE_MODELS: "${CLAUDE_MODELS}"
      CLAUDE_MODEL: "${CLAUDE_MODEL}"
      MCP_SERVERS: "${MCP_SERVERS:-[]}"           # external MCP hub: one place -> all adapters
      WORKSPACE: "${WORKSPACE:-${HOME}}"
      # HOME must equal the mounted workspace or `~` resolves to an empty dir in the image and the
      # agent concludes it has no filesystem — even though ${WORKSPACE} is mounted read/write.
      HOME: "${WORKSPACE:-${HOME}}"
      # ...BUT the Agent SDK persists its own state to $HOME/.claude.json, which with HOME=$WORKSPACE
      # is the human's REAL Claude Code config — it overwrote it with a minimal container-side version
      # (mcpServers and hasCompletedOnboarding gone), so `claude` on the host started demanding a
      # fresh login. Pin the SDK's config dir INSIDE the image so it can never clobber the host's.
      CLAUDE_CONFIG_DIR: "/home/node/.claude"

  opencode:
    build: ./opencode
    image: agent-hub/opencode
    container_name: opencode
    profiles: ["node"]                             # HUB (aibo) runs `opencode serve` on the HOST (full access)
    restart: unless-stopped
    expose:
      - "4096"
    user: "${DOCKER_USER:-1000:1000}"
    working_dir: ${WORKSPACE:-${HOME}}
    volumes:
      - ${WORKSPACE_HOST:-${HOME}}:${WORKSPACE:-${HOME}}
    environment:
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      MCP_SERVERS: "${MCP_SERVERS:-[]}"           # external MCP hub: one place -> all adapters
      # same as owui-claude: `~` must be the mounted workspace, not an empty dir in the image
      HOME: "${WORKSPACE:-${HOME}}"

  owui-opencode:
    build: ./owui-opencode
    image: agent-hub/owui-opencode
    container_name: owui-opencode
    profiles: ["node"]                             # HUB runs the opencode adapter on the HOST (full access)
    restart: unless-stopped
    ports:
      - "${ADAPTER_BIND:-127.0.0.1}:9213:9213"
    environment:
      OPENCODE_BASE: "http://opencode:4096"
      ADAPTER_KEY: "${ADAPTER_KEY}"
      PORT: "9213"
      OPENCODE_MODELS: "${OPENCODE_MODELS}"
      FF_STATE_DIR: "/ffstate"
    volumes:
      - ./ff-state:/ffstate
    depends_on:
      - opencode

  # E10.6 — node front-door: ONE address for this worker's agents + terminal, so the hub reaches
  # everything via a single Pangolin resource (register.mb) instead of one hostname per port.
  # Routes /claude→owui-claude, /opencode→owui-opencode, /term→host owui-terminal. Node role only.
  node-frontdoor:
    image: caddy:2-alpine
    container_name: agent-hub-frontdoor
    profiles: ["node"]
    restart: unless-stopped
    ports:
      - "${FRONTDOOR_BIND:-127.0.0.1}:${FRONTDOOR_PORT:-8088}:8088"
    volumes:
      - ./node/frontdoor/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host's owui-terminal (:7681) on Linux nodes
    depends_on:
      - owui-claude
      - owui-opencode

  ollama:
    image: ollama/ollama
    container_name: ollama
    profiles: ["hub"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ONE shared MCP server: publish_artifact + notify for ALL agents. Tool logic lives here.
  mcp-tools:
    build: ./mcp-tools
    image: agent-hub/mcp-tools
    container_name: mcp-tools
    profiles: ["hub"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8009:8000"
    environment:
      PORT: "8000"
      ARTIFACTS_API: "${ARTIFACTS_API:-http://artifacts:8080/api/publish}"
      PUBLIC_BASE: "${PUBLIC_BASE:-http://localhost:8080}"
      PUBLISH_TOKEN: "${PUBLISH_TOKEN}"
      NTFY_URL: "${NTFY_URL}"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
    networks:
      - default
      - apps

  # Heartbeats THIS machine into the OWUI machine selector (node registry). Same service on hub + node;
  # env decides which machine it registers and which hub it points at.
  registrar:
    build: ./node
    image: agent-hub/registrar
    container_name: agent-hub-registrar
    profiles: ["hub", "node"]
    restart: unless-stopped
    environment:
      HUB_REGISTER_URL: "${HUB_REGISTER_URL:-http://open-webui:8080/api/v1/nodes/register}"
      NODE_HUB_TOKEN: "${NODE_HUB_TOKEN:-}"
      NODE_LABEL: "${NODE_LABEL:-aibo}"
      NODE_URL: "${NODE_URL:-http://open-webui:8080}"
      NODE_API_URL: "${NODE_API_URL:-http://open-webui:8080}"
      NODE_TOKEN: "${NODE_TOKEN:-}"
      NODE_CAPABILITIES: "${NODE_CAPABILITIES:-terminal,claude,opencode}"
      NODE_MODELS: "${NODE_MODELS:-}"
      TERMINAL_ID: "${TERMINAL_ID:-}"
      TERMINAL_NAME: "${TERMINAL_NAME:-}"
      TERMINAL_URL: "${TERMINAL_URL:-}"
      TERMINAL_KEY: "${TERMINAL_KEY:-}"
      HEARTBEAT_SECONDS: "${HEARTBEAT_SECONDS:-30}"

  # Slack as a first-class hub frontend (chat with any model/agent from Slack). OPT-IN profile so it
  # only starts once you've set the tokens: add `slack` to COMPOSE_PROFILES (e.g. COMPOSE_PROFILES=hub,slack).
  slack-gateway:
    build: ./slack-gateway
    image: agent-hub/slack-gateway
    container_name: slack-gateway
    profiles: ["slack"]
    restart: unless-stopped
    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:-}"
      OWUI_BASE: "http://open-webui:8080"
      OWUI_API_KEY: "${OWUI_API_KEY:-}"
      DEFAULT_MODEL: "${SLACK_DEFAULT_MODEL:-claude-sonnet-5}"
      SLACK_STATE_PATH: "/state/sessions.json"
    volumes:
      - ./slack-gateway/state:/state

volumes:
  open-webui:
    external: true
  open-webui-staging:            # staging/canary data — compose-managed (not external), safe to wipe
  ollama:
    external: true

networks:
  default:
  apps:
    external: true
